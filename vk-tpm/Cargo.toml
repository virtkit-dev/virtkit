[package]
name = "vk-tpm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# The Rust TPM 2.0 engine behind libkrun's CRB device, replacing libtpms. See
# docs/tpm-design.md. Crypto comes from RustCrypto crates only, never hand-rolled.
[dependencies]
aes.workspace = true
cfb-mode.workspace = true
crypto-bigint.workspace = true
crypto-primes.workspace = true
ecdsa.workspace = true
# sys_rng: the host's CSPRNG as a rand_core RNG, for rsa's blinding and ECDSA's hedged nonces.
getrandom = { workspace = true, features = ["sys_rng"] }
hmac.workspace = true
p256.workspace = true
rsa.workspace = true
# oid: the DigestInfo prefixes of RSASSA-PKCS1-v1_5 signatures. zeroize: a hash state is wiped
# when dropped (an HMAC sequence's inner hash is keyed).
sha1 = { workspace = true, features = ["oid", "zeroize"] }
sha2 = { workspace = true, features = ["oid", "zeroize"] }
subtle.workspace = true
zeroize.workspace = true

# Every byte this crate parses comes from the guest: a panic or an overflow is a VMM crash.
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
