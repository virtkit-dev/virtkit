# cargo-audit configuration (consumed by ./audit.sh).
#
# RUSTSEC-2025-0141 — `bincode` is unmaintained (informational, no vulnerability). It
# enters the tree via imago, the qcow2 image library used by the vendored libkrun's block
# devices, which uses it for fixed-layout big-endian (de)serialization of qcow2 metadata
# structs. imago 0.2.4 (the vendored release) still depends on it, so there is no upstream fix to take.
# bincode 2 is pure safe Rust and the usage is internal struct coding, not a network-facing
# format. Revisit and drop this entry when imago releases a version off bincode.
#
# RUSTSEC-2026-0543 — `chrono` is unmaintained (informational, no vulnerability; no
# patched version). No virtkit crate uses it: it enters through oci-client 0.18.0
# (vk-driver) and russh-sftp 3.0.1 and russh-util 0.52.0 (vk-agent's russh), each the
# latest release, so there is no upgrade that drops it. Revisit and drop this entry when
# they move to jiff or time, the advisory's recommended alternatives.
[advisories]
ignore = [
    "RUSTSEC-2025-0141", # bincode: unmaintained (see above)
    "RUSTSEC-2026-0543", # chrono: unmaintained, via oci-client and russh (see above)
]
