# cargo-audit configuration (consumed by ./audit.sh).
#
# RUSTSEC-2023-0071 — Marvin attack (timing side-channel) on the `rsa` crate. No fixed
# stable release: the constant-time fixes are split across upstream issue #626 (padding)
# and PR #680 (the decrypt Ok/Err oracle) and currently exist only in the unreleased rsa
# 0.10 release candidates. `rsa` enters the tree two ways:
#   - via russh (vk-agent's optional `ssh` feature): rsa 0.10-rc, which already carries
#     those fixes; used so the embedded SSH server can verify clients' RSA public keys.
#   - via jsonwebtoken's `rust_crypto` backend (oci-client, in vk-driver): rsa 0.9.10
#     (unpatched), but the only call is `insecure_decode`, which parses a registry bearer
#     token's claims and runs no RSA operation — the vulnerable code is never reached.
#
# Residual risk here is low on both paths: our SSH host key is Ed25519 and the server does
# RSA signature *verification* (public-key side), not the private-key decryption that is
# Marvin's sharpest edge; the token-parsing path performs no RSA at all. Revisit and drop
# this entry when rsa 0.10 ships stable.
#
# RUSTSEC-2025-0141 — `bincode` is unmaintained (informational, no vulnerability). It
# enters the tree via imago, the qcow2 image library used by the vendored libkrun's block
# devices, which uses it for fixed-layout big-endian (de)serialization of qcow2 metadata
# structs. imago 0.2.3 (latest) still depends on it, so there is no upstream fix to take.
# bincode 2 is pure safe Rust and the usage is internal struct coding, not a network-facing
# format. Revisit and drop this entry when imago releases a version off bincode.
#
# RUSTSEC-2026-0173 — `proc-macro-error2` is unmaintained (informational, no
# vulnerability). It is never compiled: it reaches Cargo.lock only through jiff's optional
# `defmt` feature (jiff ← env_logger ← libkrun), which nothing enables — Cargo locks the
# union of all optional dependencies, and cargo-audit scans the lockfile.
# `cargo tree -i proc-macro-error2 --target all` confirms it is absent from every build.
# Revisit and drop this entry when jiff or defmt-macros move off proc-macro-error2.
[advisories]
ignore = [
    "RUSTSEC-2023-0071", # rsa: Marvin attack (see above)
    "RUSTSEC-2025-0141", # bincode: unmaintained (see above)
    "RUSTSEC-2026-0173", # proc-macro-error2: unmaintained, never compiled (see above)
]
