[package]
name = "vk-driver"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
# `src/dev/schema.rs` embeds the schema from `docs/schema/`, outside the crate directory.
publish = false

# The single shipped binary is `vk` — vk-driver with the guest kernel and vk-agent
# embedded (see build.rs + src/embed.rs, the default `embed` feature).
[[bin]]
name = "vk"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
vk-core = { path = "../vk-core" }
# filesystem objects created private and published whole: the state dir's artifacts
vk-fs = { path = "../vk-fs" }
# the content-addressed OCI store + helpers, shared with the standalone vk-registry
# daemon; vk links it for its in-process build cache (registry.rs `mod local`).
vk-registry = { path = "../vk-registry" }
# `vk update`: the release-install path, shared with the vk-registry binary.
vk-selfupdate = { path = "../vk-selfupdate" }
futures.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
tar.workspace = true
oci-client.workspace = true
flate2.workspace = true
sha2.workspace = true
fastcdc.workspace = true
zstd.workspace = true
lzma-rs.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util", "signal"] }
tokio-util.workspace = true
toml.workspace = true
etherparse.workspace = true
ipstack.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
reqwest.workspace = true
rustls.workspace = true
# Shared formats: what `vk workloads` prints for its readers, and the hub↔node wire types.
vk-hub-proto = { path = "../vk-hub-proto" }
# `vk node`: the node's ed25519 identity, and the WebSocket session to the hub — dialed
# through tokio-rustls (as vk-registry's server uses it, on ring) and verified by the platform
# verifier (see the workspace Cargo.toml).
ring.workspace = true
tokio-tungstenite.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rustls-platform-verifier.workspace = true

log.workspace = true
indicatif.workspace = true
unicode-width.workspace = true

[target.'cfg(target_env = "musl")'.dependencies]
jemallocator.workspace = true

# libkrun, the VMM, an rlib crate dep so it shares
# vk's std — no double-std / broken-unwinding that a static libkrun.a link
# hits. Vendored under third_party/libkrun (rev 9a8fedc, stable-1.19.x with PR #728)
# and locally patched so the passthrough fs device no longer needs libc's musl statx
# bindings (dropped after 0.2.183) — letting the whole tree build on a modern libc.
# See third_party/libkrun/VENDOR.md. default-features off drops the init-blob (we use
# disable_implicit_init); blk (krun_add_disk2) + net.
[dependencies.krun]
path = "../third_party/libkrun/src/libkrun"
package = "libkrun"
default-features = false
features = ["blk", "net"]

# Opt-in libkrun 2.0-dev Rust API (third_party/libkrun-next; see its VENDOR.md).
# With `krun2`, the boot child uses src/libkrun2_sys.rs instead of the 1.19 C API.
[dependencies.krun2]
path = "../third_party/libkrun-next/src/libkrun"
package = "libkrun"
default-features = false
features = ["blk", "net"]
optional = true

[features]
default = ["embed"]
# Embed the guest kernel (vmlinux) and vk-agent into the `vk` binary so it runs
# self-contained (no --kernel/--agent, no files under /usr/local/lib/vk). build.rs
# reads VK_EMBED_KERNEL / VK_EMBED_AGENT at compile time; when unset (a plain dev
# `cargo build`) it embeds nothing and the runtime falls back to those flags. See
# src/embed.rs. build.sh sets the two vars for a real, shippable self-contained `vk`.
embed = []
# Boot VMs with libkrun 2.0 (src/libkrun2_sys.rs) instead of the 1.19 tree. Not shipped yet.
krun2 = ["dep:krun2"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# Match indicatif's line measurement in dashboard tests.
console.workspace = true
