[package]
name = "vk-driver"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# The single shipped binary is `vk` — vk-driver with the guest kernel and vk-agent
# embedded (see build.rs + src/embed.rs, the default `embed` feature).
[[bin]]
name = "vk"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
vk-core = { path = "../vk-core" }
# the content-addressed OCI store + helpers, shared with the standalone vk-registry
# daemon; vk links it for its in-process build cache (registry.rs `mod local`).
vk-registry = { path = "../vk-registry" }
# `vk update`: the release-install path, shared with the vk-registry binary.
vk-selfupdate = { path = "../vk-selfupdate" }
# thread-pool: the virtiofsd daemon's optional request worker pool
futures = { workspace = true, features = ["thread-pool"] }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
tar.workspace = true
oci-client.workspace = true
flate2.workspace = true
sha2.workspace = true
fastcdc.workspace = true
zstd.workspace = true
lzma-rs.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util", "signal"] }
tokio-util.workspace = true
toml.workspace = true
etherparse.workspace = true
ipstack.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
reqwest.workspace = true
rustls.workspace = true
# feature-unification only (forces oci-client's jsonwebtoken onto rust_crypto, not
# aws-lc-rs); not referenced in code.
jsonwebtoken.workspace = true

# Bundled vhost-user virtio-fs daemon (the `vk virtiofsd` subcommand) — a default
# feature, disable with --no-default-features. FUSE requests are served by the
# vendored libkrun fs engine (krun-devices, the same code the libkrun backend uses
# in-process); only the vhost-user transport comes from crates.io, pinned to the
# stack proven against cloud-hypervisor. The seccomp sandbox is pure-Rust
# (seccompiler) — no libseccomp, no libcap-ng, no C linking.
vhost = { version = "0.17", features = ["vhost-user-backend"], optional = true }
vhost-user-backend = { version = "0.23", optional = true }
virtio-queue = { version = "0.18", optional = true }
virtio-bindings = { version = "0.2", optional = true }
vm-memory = { version = "0.18", features = ["backend-mmap", "backend-atomic"], optional = true }
# libkrun's vm-memory (the Reader/Writer VolatileSlice type), renamed so both
# versions coexist; the daemon re-wraps 0.18 slices as 0.17 by pointer.
vm-memory-krun = { package = "vm-memory", version = "=0.17.1", features = ["backend-mmap"], optional = true }
vmm-sys-util = { version = "0.15", optional = true }
seccompiler = { version = "0.5", optional = true }
log.workspace = true
indicatif.workspace = true
unicode-width.workspace = true

# The vendored libkrun fs engine (FUSE server + passthrough + read-only wrapper),
# locally patched to expose it (see third_party/libkrun/VENDOR.md). Shared with the
# `libkrun` feature, which reaches the same crate through the `krun` dependency.
[dependencies.devices]
package = "krun-devices"
path = "../third_party/libkrun/src/devices"
optional = true

[target.'cfg(target_env = "musl")'.dependencies]
jemallocator.workspace = true

# libkrun VMM backend (the `libkrun` feature), an rlib crate dep so it shares
# vk's std — no double-std / broken-unwinding that a static libkrun.a link
# hits. Vendored under third_party/libkrun (rev 9a8fedc, stable-1.19.x with PR #728)
# and locally patched so the passthrough fs device no longer needs libc's musl statx
# bindings (dropped after 0.2.183) — letting the whole tree build on a modern libc.
# See third_party/libkrun/VENDOR.md. default-features off drops the init-blob (we use
# disable_implicit_init); blk (krun_add_disk2) + net.
[dependencies.krun]
path = "../third_party/libkrun/src/libkrun"
package = "libkrun"
default-features = false
features = ["blk", "net"]
optional = true

[features]
default = ["virtiofsd", "libkrun", "embed"]
# Embed the guest kernel (vmlinux) and vk-agent into the `vk` binary so it runs
# self-contained (no --kernel/--agent, no files under /usr/local/lib/vk). build.rs
# reads VK_EMBED_KERNEL / VK_EMBED_AGENT at compile time; when unset (a plain dev
# `cargo build`) it embeds nothing and the runtime falls back to those flags. See
# src/embed.rs. build.sh sets the two vars for a real, shippable self-contained `vk`.
embed = []
# compile the bundled virtio-fs daemon into vk (the libkrun fs engine served over
# vhost-user for the cloud-hypervisor backend)
virtiofsd = [
    "dep:devices",
    "dep:vhost",
    "dep:vhost-user-backend",
    "dep:virtio-queue",
    "dep:virtio-bindings",
    "dep:vm-memory",
    "dep:vm-memory-krun",
    "dep:vmm-sys-util",
    "dep:seccompiler",
]
# the libkrun VMM backend, driven by the `__libkrun-boot` subcommand. libkrun is
# reached via its C ABI; we always pass our own kernel (krun_set_kernel) so it
# never loads libkrunfw. Its rust-vmm deps (vm-memory 0.17, …) coexist with the
# bundled virtiofsd's (0.16) — independent subsystems, so no version unification.
# On by default: libkrun is the default backend (selection is env-driven, see
# vmm::libkrun_selected); VIRTKIT_VMM=cloud-hypervisor opts out, and jobs libkrun
# cannot serve (e.g. uid/gid-mapped shares) refuse with a pointer to that switch.
libkrun = ["dep:krun"]

[dev-dependencies]
# Match indicatif's line measurement in dashboard tests.
console.workspace = true
