# virtkit configuration. The first file found wins (exactly one is read):
#   --config <path>  >  $VIRTKIT_CONFIG  >  ~/.config/virtkit/config.toml  >  /etc/virtkit/config.toml
# Example targeting a bootable guest bundle; every key is optional.

# state_dir = "/var/lib/virtkit"          # job state: <state_dir>/jobs/<job id>/
# vmm = "libkrun"                          # or "cloud-hypervisor"; VIRTKIT_VMM overrides
# cloud_hypervisor = "/usr/local/bin/cloud-hypervisor"
# virtiofsd = "/usr/local/bin/virtiofsd"      # external virtiofsd (default: bundled)
# image_cache_idle_secs = 1800   # a materialized image base (registry/docker) left idle
#                                # this many seconds is evicted at the next fresh pull into
#                                # that tier; a base under a live overlay is never evicted. 30 min.

[vm]
# cpus = 4
# mem = "4G"           # lazily allocated (memfd); size it for the job + [guest] tmpfs
# hostname = "runner"
# vsock_port = 4444
# balloon = true       # free_page_reporting: freed guest RAM returns to the host
# max_cpus = 32        # ceilings for the per-job MICROVM_CPUS/MICROVM_MEM
# max_mem = "128G"     # variables (unset = jobs cannot exceed cpus/mem above)
# nested = false       # let jobs boot microVMs of their own (vk inside vk); needs
#                      # kvm_intel/kvm_amd nested=1, and widens what a job can reach
# cmdline_extra = ""
# boot_timeout_secs = 120
# shutdown_timeout_secs = 15

[guest]
# builds_dir = "/builds"
# cache_dir = "/cache"
# run_command = ["bash"]
# tmpfs = ["/builds:64G", "/rd:16G"]   # RAM-backed scratch (slow disks); needs vm.mem sized for it

# Dev only — a guest image that assembles itself from a directory mounted as
# /workdir. CI images must not share anything from the host.
# [share]
# dir = "/path/to/repo"
# readonly = true

[net]
# mode = "none"                # none | tap (single, dev) | pool (production)
#
# mode = "tap": one pre-created tap, one VM at a time
# tap = "tap0"                 # pre-create the tap on a bridge yourself
# mac = "52:54:00:d2:f0:01"
# ip = "172.18.0.250/16"       # static guest config via the kernel `ip=` param
# gw = "172.18.0.1"
# dns = "172.18.0.1"
#
# mode = "pool": taps <tap_prefix>0..<count-1> pre-created on a NATed bridge;
# VM i gets subnet .16+i, gw/dns default to the subnet's .1
# tap_prefix = "civtap"
# count = 32
# subnet = "192.168.231.0/24"

# [egress]               # RUN-phase allowlist for net.mode = "switch" (the booted job guest
#                        # and the service VMs sharing its LAN). An ABSENT list is
#                        # unrestricted; an explicit empty list denies that dimension
#                        # (allow_name = [] => no DNS). A phase is unrestricted only when both
#                        # lists are absent.
# allow_ip = ["10.0.0.0/8", "1.2.3.4:5432"]  # direct (non-DNS) egress CIDRs, optionally
#                                            # port-scoped as CIDR:port (else any port)
# allow_name = ["corp.example.com"]    # DNS suffixes (dot-anchored: also *.corp.example.com)
# audit = true           # audit mode: list every external domain each job contacts (and how
#                        # many times) at the end of its trace. Leave the lists absent
#                        # (unrestricted) + audit = true to observe without blocking. A job
#                        # can also set MICROVM_EGRESS_AUDIT.
#
# [egress.build]         # BUILD-phase allowlist — a git-defined image / compose build:
#                        # service's RUN steps. Same shape/semantics as [egress]. Absent
#                        # (the default) = unrestricted, like `docker build`.
# allow_name = ["deb.debian.org", "crates.io"]
# audit = true
#
# A CI job may only NARROW these caps, never widen (subset-of-config), via job variables —
# for the run phase: MICROVM_EGRESS_ALLOW_IP, MICROVM_EGRESS_ALLOW_NAME, MICROVM_EGRESS_AUDIT;
# for the build phase: MICROVM_BUILD_EGRESS_ALLOW_IP, MICROVM_BUILD_EGRESS_ALLOW_NAME,
# MICROVM_BUILD_EGRESS_AUDIT. Against an absent (unconstrained) cap a variable defines the
# list freely; against an empty (deny-all) cap it can add nothing.
#
# A single service can override the run policy for itself by setting MICROVM_EGRESS_ALLOW_IP /
# MICROVM_EGRESS_ALLOW_NAME in its OWN `variables:` (narrowed against the same [egress] cap) —
# e.g. a DB service with `MICROVM_EGRESS_ALLOW_NAME: ""` gets no external egress while the job
# keeps its own. A service that sets neither shares the run policy.

# [auth]                 # host credentials forwarded into job VMs.
# ssh_agent = true       # forward the runner's $SSH_AUTH_SOCK so the guest's ssh/git use
#                        # the host keys; keys never enter the guest (no-op if unset on
#                        # the runner). Same vsock-forward model as [services].

# [build]                # defaults for `vk build` (a CLI flag always overrides).
# cloud_hypervisor = "/usr/local/bin/cloud-hypervisor"  # default: top-level cloud_hypervisor
# kernel = "/usr/local/lib/vk/vmlinux"             # build guest kernel
# agent = "/usr/local/lib/vk/vk-agent"        # injected as PID 1
# cache_registry = "127.0.0.1:5000"
#                        # shared instruction cache: any OCI registry (a `vk-registry` to
#                        # share it across runners; the cache_* keys below carry its TLS and
#                        # credentials), or an absolute path / file:// URL for a store on
#                        # this disk, accessed in-process (default:
#                        # $XDG_DATA_HOME/virtkit/registry). `none` disables caching.
#                        # A path here is also the store `vk registry status`/`gc` report on
#                        # and sweep with no --root; with a registry server (the value above)
#                        # the store is on that host, so they refuse until given a --root.
#                        # Same store format as [registry] repo — a local one may be that
#                        # very directory; see [registry] below.
# cache_insecure = true                                 # the cache registry is plain HTTP
# cache_ca_file = "/etc/virtkit/registry-ca.crt"        # PEM CA for a TLS cache registry
# cache_username = "ci-push"                            # HTTP Basic; empty = anonymous
# cache_password_file = "/etc/virtkit/registry-password"
# cache_token_file = "/etc/virtkit/registry-token"      # static bearer (wins over Basic)
# journal = false                                       # add an ext4 journal to the export
# jobs = 4               # max stages built concurrently (--build-jobs overrides;
#                        # default: auto, bounded by host RAM). 1 = sequential
# cpus = 8               # per-stage build guest vCPUs (default: host CPUs, capped 16)
# mem = "8G"             # per-stage build guest RAM (default: 4G)
# cache_checkpoint_secs = 20  # `auto` cache mode: seconds of run time before a checkpoint

# [gitlab]               # host-side pieces of the GitLab custom executor
# dir = "/usr/local/lib/vk/ci-tools"  # static tools shared read-only into job VMs
# host_checkout = true   # clone the sources on the host and share them at CI_PROJECT_DIR,
#                        # instead of letting the job clone them in the guest
# checkout_dir = "/builds"  # host storage for the clones, in a private `vk` subtree of it
#                        # (default: <state_dir>/checkouts); a host tmpfs keeps the clone and the
#                        # job's writes in RAM instead of on the state disk
# checkout_cache_idle_secs = 1800  # unused clones are reclaimed before a checkout and by
#                        # `vk gc`; unset inherits image_cache_idle_secs
# checkout_overlay = true  # build on a guest tmpfs overlay over the read-only host tree,
#                        # so writes run at guest speed and the guest cannot touch the host
# checkout_overlay_size = "80%"  # how much of the VM's memory that layer may take ("80%",
#                        # "12G"). The cap a build tree has to fit under: too low fails a job
#                        # with ENOSPC that the VM had the memory for, too near 100% starves
#                        # the job's own processes into the OOM killer. Costs nothing until a
#                        # job reaches it; each job trace reports the mark it reached against it
# atop = true            # record what each job's guest did: the guest samples its own /proc
#                        # and writes it in `atop -P` text format to
#                        # <state_dir>/atop/<date>/<job>/atop.log, which any atop parser (or
#                        # grep/awk) reads. On by default — a host-side monitor sees only one
#                        # VMM process per job, and the VM is gone when the job ends. Costs the
#                        # guest a read-write share of that one directory, and `psi=1` on its
#                        # own kernel for the pressure figures
# atop_interval_secs = 10  # seconds between samples (at least 1); fine enough that a job of
#                        # a few minutes still shows its phases, at a few MiB per job-hour
# atop_retention_days = 14  # days back the archive keeps beside today's, in whole UTC days: a
#                        # day past the window is dropped whole by the first job recorded the
#                        # next day (0 = only today, and loses the log of a job still running
#                        # from yesterday). Reclamation stops with `atop = false`

# [schedule]             # how many CI jobs run at once, by the memory they boot. Off by
#                        # default: gitlab-runner's `concurrent` alone decides, and past
#                        # the host's RAM the OOM killer picks which VM dies. With a budget
#                        # set, a job claims its guest RAM before booting and waits for
#                        # room, oldest request first. Jobs report what they actually used
#                        # (see the end of a job trace) — size the budget from that.
# mem_budget = "50%"     # total GUEST RAM admitted at once: an exact "48G", or a share of
#                        # this host's MemTotal rounded up to whole GiB. Leave the rest of
#                        # the host's memory for the VMMs, host tmpfs and everything else
# from_history = false   # reserve what a job of this kind has been using (its largest run
#                        # of the last 14 days at its current MICROVM_MEM + headroom, capped
#                        # by what it declares) instead of declared size, so a host runs as
#                        # many jobs as it can really hold. The VM still gets the memory it
#                        # declares. Off by default: a job that suddenly needs far more than
#                        # it ever has is admitted on the old figure. Turn it on once a few
#                        # pipelines have been measured.
# wait_timeout_secs = 600  # then the job fails as a *system* failure, which GitLab retries
#                        # for jobs that ask (`retry: { when: runner_system_failure }`)

# MICROVM_IMAGE is prefix-based (the prefix names the source): unset = local/default;
# `local/<name>` = a bundle dir under [local] dir; `virtkit/<name>[:tag|@digest]` =
# a [registry] bundle; `docker/<name>[:tag|@digest]` = an OCI image booted directly
# from the [docker] repo.

# [local]                # local guest bundles on the host filesystem. Each
#                        # <dir>/<name>/ is a baked bundle (runner.ext4 + boot.kind
#                        # [+ vmlinuz + initrd.img]). Backs the local/<name> form.
#                        # A kernel-less bundle boots vk's embedded kernel.
# dir = "/usr/local/lib/vk/images"   # default: <state_dir>/images

# [registry]             # native OCI bundle registry: push/pull guest bundles with
#                        # content-defined chunk dedup (CDC + per-chunk zstd), no
#                        # oras, no docker. Backs the virtkit/<name> MICROVM_IMAGE form.
# repo = "registry.example.com/team"   # fixed host-side = the image allowlist. An absolute
#                        # path or file:// URL instead names a store on this disk that
#                        # `vk registry push` and `vk build --tag` write in-process — no
#                        # daemon, no port, and the auth/TLS keys below no longer apply.
#                        # Pulling by name (`registry pull`/`inspect`, the virtkit/<name>
#                        # form) still speaks HTTP, so serve that directory with a
#                        # `vk-registry` for the hosts that consume the bundles.
#                        #
#                        # It is the same store format as [build] cache_registry, and the two
#                        # occupy different repos inside one (`build-cache` for the build cache,
#                        # one per bundle name), so when both are local the simplest setup is
#                        # ONE directory for both: chunk dedup spans them, a single
#                        # `vk registry gc` covers both, and `vk registry status` lists them
#                        # together. That one gc expires idle tags in every repo, so its
#                        # --retention-days applies to bundles others pull by name too.
#                        # Two paths = two stores; status/gc then follow the build-cache
#                        # one unless given --root.
# ca_file = "/etc/virtkit/registry-ca.crt"  # PEM CA the registry TLS chains to
# username = "ci-push"             # HTTP Basic; empty = anonymous (no auth)
# password_file = "/etc/virtkit/registry-password"   # file holding the password
#                                  # (kept out of this config); read at runtime,
#                                  # provision it 0600. Sent over TLS — see ca_file.
# token_file = "/etc/virtkit/registry-token"   # static bearer token instead of Basic
#                                  # (for an Auth::Bearer registry); wins over username
# insecure = false                 # plain HTTP (a local/insecure registry)

# [docker]               # OCI images booted directly on demand (native OCI client, no
#                        # docker daemon). MICROVM_IMAGE is `docker/<name>[:tag|@digest]`;
#                        # the image is pulled, flattened to a bootable ext4 with the
#                        # embedded vk-agent as PID 1, and booted on vk's embedded kernel.
#                        # Every field is optional — the section may be empty, or carry
#                        # only a [docker.mirror].
# repo = "registry.example.com/team"   # the docker/<name> form + bare names route here;
#                                  # omit for a mirror-only [docker]
# ca_file = "/etc/virtkit/registry-ca.crt"  # PEM CA the registry TLS chains to
# username = "ci-push"             # HTTP Basic; empty = anonymous
# password_file = "/etc/virtkit/registry-password"   # file holding the password
#                                  # (read at runtime, provision it 0600)
# token_file = "/etc/virtkit/docker-token"   # static bearer token instead of Basic
#                                  # (a vk-registry in mode = "accounts"); wins over
#                                  # username. Sent over TLS — see ca_file.
# insecure = false                 # plain HTTP (a local/insecure registry)

# [docker.mirror]        # Docker Hub pull-through mirror = the `registry-mirrors` equivalent.
#                        # Bare docker-hub names and explicit docker.io/… refs are fetched
#                        # through it (library/ added for official images), with NO direct
#                        # fallback — so jobs need no direct Docker Hub egress. Only Docker
#                        # Hub is routed; other registries are untouched. Auth is its own.
# repo = "hq-nexus.example.com:8440"  # the Hub proxy (Nexus/Artifactory/registry:2)
# ca_file = "/etc/virtkit/mirror-ca.crt"   # PEM CA the mirror TLS chains to
# username = ""                    # HTTP Basic; empty = anonymous
# password_file = "/etc/virtkit/mirror-password"   # file holding the password
# token_file = "/etc/virtkit/mirror-token"   # static bearer token instead of Basic;
#                                  # wins over username. Sent over TLS — see ca_file.
# insecure = false                 # plain HTTP

# [services]            # CI `services:` support. Each declared service boots as a
#                       # sibling microVM on the per-job switch, resolvable by its
#                       # alias over the switch DNS — job images no longer need
#                       # docker. Requires the job's [net] mode = "switch". This
#                       # section is optional; services work with its defaults.
# store_dir = "/var/lib/virtkit/services"  # shared content-addressed image store,
#                       # one entry per image digest, shared by every job on the
#                       # runner. Default: <state_dir>/services.
