<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="vk-registry">
  <title>vk-registry</title>
  <!-- virtkit's chip with amber-to-rose image layers instead of vk-hub's cyan-to-indigo V,
       so the two products share a motif but remain distinct in browser tabs. -->
  <defs>
    <linearGradient id="vk-r" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="vk-chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <g fill="#64748b">
    <rect x="64" y="22" width="10" height="14" rx="2"/><rect x="95" y="22" width="10" height="14" rx="2"/><rect x="126" y="22" width="10" height="14" rx="2"/>
    <rect x="64" y="164" width="10" height="14" rx="2"/><rect x="95" y="164" width="10" height="14" rx="2"/><rect x="126" y="164" width="10" height="14" rx="2"/>
    <rect x="22" y="64" width="14" height="10" rx="2"/><rect x="22" y="95" width="14" height="10" rx="2"/><rect x="22" y="126" width="14" height="10" rx="2"/>
    <rect x="164" y="64" width="14" height="10" rx="2"/><rect x="164" y="95" width="14" height="10" rx="2"/><rect x="164" y="126" width="14" height="10" rx="2"/>
  </g>
  <rect x="36" y="36" width="128" height="128" rx="22" fill="url(#vk-chip)"/>
  <rect x="44" y="44" width="112" height="112" rx="16" fill="none" stroke="#334155" stroke-width="2"/>
  <!-- Three image layers seen from the side: the full top layer and the lower layers' edges. -->
  <path d="M100 116 L148 96 L148 106 L100 126 L52 106 L52 96 Z" fill="url(#vk-r)" opacity="0.55"/>
  <path d="M100 102 L148 82 L148 92 L100 112 L52 92 L52 82 Z" fill="url(#vk-r)" opacity="0.8"/>
  <path d="M100 52 L148 72 L100 92 L52 72 Z" fill="url(#vk-r)" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="100" cy="72" r="6" fill="#0f172a"/>
  <circle cx="100" cy="72" r="3" fill="#fde68a"/>
</svg>
