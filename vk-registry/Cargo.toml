[package]
name = "vk-registry"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# The content-addressed OCI store + server, shared with vk-driver (which links the
# lib for its in-process build cache) and driven standalone by the `vk-registry` bin.
[lib]
name = "vk_registry"
path = "src/lib.rs"

[[bin]]
name = "vk-registry"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
bytes.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync"] }
reqwest.workspace = true
rustls.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
oci-client.workspace = true
sha2.workspace = true
zstd.workspace = true
libc.workspace = true
futures.workspace = true

[target.'cfg(target_env = "musl")'.dependencies]
jemallocator.workspace = true
