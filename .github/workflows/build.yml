name: Build

# Reusable workflow: build the binaries and assemble the self-contained vk.
# Called by ci.yml (on push/PR/dispatch) and release.yml (on a push to `release`).
#
# Every part builds in a job of its own, all in parallel: the guest kernel, the UEFI firmware
# (build-firmware.sh --docker compiles the patched edk2, so every CI and release vk boots UEFI
# guests out of the box), and one job per binary (build.sh --only=<bin>). vk compiles bare:
# the kernel, vk-agent and firmware it embeds are appended after the link, so its compile does
# not wait for them. assemble then appends them to the bare vk (build.sh --assemble) and
# uploads every binary with its sha256 sidecar and build-info.txt as one artifact, the one the
# end-to-end tests run and a release publishes. rebuild.yml reproduces the parts in a vk
# microVM.
#
# Inputs
#   artifact-prefix  — prefix for uploaded artifact names; callers set this to
#                      avoid collisions between CI and release runs on the same SHA.
#   build-kernel     — whether to build the guest kernel and embed it (default: false).
#   release-kernel   — embed the guest kernel of the release HEAD descends from instead,
#                      when kernel/, build-kernel.sh and the build toolchain (.devcontainer/)
#                      are as that release built them; otherwise the kernel is built.
#                      Gives a vk that boots VMs without the kernel build's tens of
#                      minutes (default: false).
#   retention-days   — how long the artifacts are kept.

on:
  workflow_call:
    inputs:
      artifact-prefix:
        type: string
        required: true
      build-kernel:
        type: boolean
        default: false
      release-kernel:
        type: boolean
        default: false
      retention-days:
        type: number
        required: true

permissions:
  contents: read

jobs:
  # Uploads the kernel assemble embeds, a release's included: publish releases it again.
  # With neither kernel input, it uploads nothing and the vk is assembled --no-kernel.
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      from: ${{ steps.release-kernel.outputs.from }}
    steps:
      # Fetch full history and tags only to select a released kernel.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.release-kernel && !inputs.build-kernel && '0' || '1' }}

      # A full kernel build takes tens of minutes and the kernel changes rarely, so only a
      # manual CI run asks for one outright.
      - name: Build guest kernel (vmlinux)
        if: inputs.build-kernel
        run: ./build-kernel.sh

      # Reuse the ancestor release's kernel when kernel/, build-kernel.sh and .devcontainer/
      # match its manifest's commit: the kernel version, config, build script and the
      # toolchain it builds with are unchanged, so a rebuild would give the same kernel. Build
      # the kernel if any of them changed or no release kernel is available.
      - name: Fetch the released guest kernel (vmlinux)
        id: release-kernel
        if: inputs.release-kernel && !inputs.build-kernel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_kernel() {
            echo "$1"
            ./build-kernel.sh
            exit 0
          }
          mkdir -p dist
          tag=$(git describe --tags --abbrev=0 --match 'v*' HEAD) ||
            build_kernel "::warning::no release tag reachable from HEAD; building the guest kernel"
          gh release download "$tag" --pattern vmlinux --pattern vmlinux.sha256 \
            --pattern kernel-build-info.txt --dir dist ||
            build_kernel "::warning::could not download $tag's guest kernel; building it"
          for f in vmlinux vmlinux.sha256 kernel-build-info.txt; do
            [ -s "dist/$f" ] || { echo "::error::release $tag has no $f"; exit 1; }
          done
          ( cd dist && sha256sum -c vmlinux.sha256 ) ||
            { echo "::error::$tag's vmlinux does not match its sha256 sidecar"; exit 1; }
          # A kernel built from a dirty tree ("<sha> (dirty)") names no commit.
          commit=$(awk '$1 == "git_commit:" && NF == 2 { print $2 }' dist/kernel-build-info.txt)
          [ -n "$commit" ] && git cat-file -e "$commit^{commit}" ||
            { echo "::error::$tag's kernel-build-info.txt names no commit of this history ('$commit')"; exit 1; }
          rc=0
          git diff --quiet "$commit" HEAD -- kernel build-kernel.sh .devcontainer || rc=$?
          case $rc in
            0)
              echo "embedding $tag's guest kernel, built at $commit"
              echo "from=$tag" >>"$GITHUB_OUTPUT"
              ;;
            # build-kernel.sh rewrites all three downloaded files.
            1) build_kernel "the kernel inputs or the toolchain changed since $tag ($commit); building the guest kernel" ;;
            *) echo "::error::git diff $commit HEAD failed (exit $rc)"; exit 1 ;;
          esac

      - name: Upload kernel artifact
        if: inputs.build-kernel || inputs.release-kernel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-kernel-${{ github.sha }}
          path: |
            dist/vmlinux
            dist/vmlinux.sha256
            dist/kernel-build-info.txt
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --docker forces Docker instead of a vk on PATH.
      - name: Build UEFI firmware (CLOUDHV.fd)
        run: ./build-firmware.sh --docker

      # firmware-build-info.txt carries the edk2 store paths build-info.txt records.
      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-firmware-${{ github.sha }}
          path: |
            dist/CLOUDHV.fd
            dist/CLOUDHV_VARS.fd
            dist/CLOUDHV_VARS.ms.fd
            dist/CLOUDHV.fd.sha256
            dist/firmware-build-info.txt
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  # `file` is what build.sh leaves in dist/: the vk it compiles is the bare one.
  binary:
    name: binary (${{ matrix.bin }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - { bin: vk, file: vk-bare }
          - { bin: vk-agent, file: vk-agent }
          - { bin: vk-registry, file: vk-registry }
          - { bin: vk-hub, file: vk-hub }
          - { bin: vk-gitlab, file: vk-gitlab }
          - { bin: vk-runnerctl, file: vk-runnerctl }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ${{ matrix.bin }}
        run: ./build.sh --docker --only=${{ matrix.bin }}

      - name: Upload ${{ matrix.file }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-bin-${{ matrix.bin }}-${{ github.sha }}
          path: |
            dist/${{ matrix.file }}
            dist/${{ matrix.file }}.sha256
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  # Appends vk-agent, the kernel and the firmware to the bare vk and writes vk.sha256 and
  # build-info.txt; no compile, so no toolchain image.
  assemble:
    needs: [kernel, firmware, binary]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: ${{ inputs.artifact-prefix }}-bin-*-${{ github.sha }}
          merge-multiple: true
          path: dist

      - name: Download the firmware
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.artifact-prefix }}-firmware-${{ github.sha }}
          path: dist

      - name: Download the kernel
        if: inputs.build-kernel || inputs.release-kernel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.artifact-prefix }}-kernel-${{ github.sha }}
          path: dist

      # Every part is checked against the sidecar its job wrote before it is embedded. Without
      # a kernel, --no-kernel; with a release's, --kernel-from records which. '' has to stay the
      # last operand: it is falsy, so swapping the arms would make `||` always fire and hand
      # --no-kernel to every build.
      - name: Assemble vk
        env:
          KERNEL_FROM: ${{ needs.kernel.outputs.from }}
        run: |
          ( cd dist && sha256sum -c ./*.sha256 )
          ./build.sh --assemble ${{ !(inputs.build-kernel || inputs.release-kernel) && '--no-kernel' || '' }} ${KERNEL_FROM:+"--kernel-from=$KERNEL_FROM"}

      - name: Upload binary artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-binaries-${{ github.sha }}
          path: |
            dist/vk
            dist/vk-agent
            dist/vk-registry
            dist/vk-hub
            dist/vk-gitlab
            dist/vk-runnerctl
            dist/vk.sha256
            dist/vk-agent.sha256
            dist/vk-registry.sha256
            dist/vk-hub.sha256
            dist/vk-gitlab.sha256
            dist/vk-runnerctl.sha256
            dist/build-info.txt
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
