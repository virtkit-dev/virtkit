name: Build

# Reusable workflow: build the binaries and assemble the self-contained vk.
# Called by ci.yml (on push/PR/dispatch) and release.yml (on a push to `release`).
#
# Every part builds in a job of its own, all in parallel: the guest kernel, the UEFI firmware
# (build-firmware.sh --docker compiles the patched edk2, so every CI and release vk boots UEFI
# guests out of the box), and one job per binary (build.sh --only=<bin>). vk compiles bare:
# the kernel, vk-agent and firmware it embeds are appended after the link, so its compile does
# not wait for them. assemble then appends them to the bare vk (build.sh --assemble) and
# uploads every binary with its sha256 sidecar and build-info.txt as one artifact, the one the
# end-to-end tests run and a release publishes. rebuild.yml reproduces the parts in a vk
# microVM. Each Docker job takes the toolchain image from the Actions cache
# (.github/actions/build-image) rather than building it from scratch.
#
# Inputs
#   artifact-prefix  — prefix for uploaded artifact names; callers set this to
#                      avoid collisions between CI and release runs on the same SHA.
#   retention-days   — how long the artifacts are kept.

on:
  workflow_call:
    inputs:
      artifact-prefix:
        type: string
        required: true
      retention-days:
        type: number
        required: true

permissions:
  contents: read

jobs:
  # Every run builds the guest kernel from its own commit, in parallel with the binaries.
  kernel:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the toolchain image
        uses: ./.github/actions/build-image

      - name: Build guest kernel (vmlinux)
        run: ./build-kernel.sh --docker

      - name: Upload kernel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-kernel-${{ github.sha }}
          path: |
            dist/vmlinux
            dist/vmlinux.sha256
            dist/kernel-build-info.txt
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  firmware:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the toolchain image
        uses: ./.github/actions/build-image

      # --docker forces Docker instead of a vk on PATH.
      - name: Build UEFI firmware (CLOUDHV.fd)
        run: ./build-firmware.sh --docker

      # firmware-build-info.txt carries the edk2 store paths build-info.txt records.
      - name: Upload firmware artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-firmware-${{ github.sha }}
          path: |
            dist/CLOUDHV.fd
            dist/CLOUDHV_VARS.fd
            dist/CLOUDHV_VARS.ms.fd
            dist/CLOUDHV.fd.sha256
            dist/firmware-build-info.txt
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  # `file` is what build.sh leaves in dist/: the vk it compiles is the bare one.
  binary:
    name: binary (${{ matrix.bin }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - { bin: vk, file: vk-bare }
          - { bin: vk-agent, file: vk-agent }
          - { bin: vk-registry, file: vk-registry }
          - { bin: vk-hub, file: vk-hub }
          - { bin: vk-gitlab, file: vk-gitlab }
          - { bin: vk-runnerctl, file: vk-runnerctl }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the toolchain image
        uses: ./.github/actions/build-image

      - name: Build ${{ matrix.bin }}
        run: ./build.sh --docker --only=${{ matrix.bin }}

      # The .build stamp records how the part was compiled, at which commit and with which
      # sha256; build.sh --assemble refuses vk-bare and vk-agent without a matching one.
      - name: Upload ${{ matrix.file }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-bin-${{ matrix.bin }}-${{ github.sha }}
          path: |
            dist/${{ matrix.file }}
            dist/${{ matrix.file }}.sha256
            dist/${{ matrix.file }}.build
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  # Appends vk-agent, the kernel and the firmware to the bare vk and writes vk.sha256 and
  # build-info.txt; no compile, so no toolchain image.
  assemble:
    needs: [kernel, firmware, binary]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact-prefix }}-bin-*-${{ github.sha }}
          merge-multiple: true
          path: dist

      - name: Download the firmware
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-firmware-${{ github.sha }}
          path: dist

      - name: Download the kernel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-kernel-${{ github.sha }}
          path: dist

      # Every part is checked against the sidecar its job wrote before it is embedded.
      - name: Assemble vk
        run: |
          ( cd dist && sha256sum -c ./*.sha256 )
          ./build.sh --assemble

      # upload-artifact fails only when none of the paths exist; every one of them must.
      - name: Check every file is there
        run: |
          for f in vk vk-agent vk-registry vk-hub vk-gitlab vk-runnerctl; do
            for p in "dist/$f" "dist/$f.sha256"; do
              test -e "$p" || { echo "::error::missing $p"; exit 1; }
            done
          done
          test -e dist/build-info.txt || { echo "::error::missing dist/build-info.txt"; exit 1; }

      - name: Upload binary artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-binaries-${{ github.sha }}
          path: |
            dist/vk
            dist/vk-agent
            dist/vk-registry
            dist/vk-hub
            dist/vk-gitlab
            dist/vk-runnerctl
            dist/vk.sha256
            dist/vk-agent.sha256
            dist/vk-registry.sha256
            dist/vk-hub.sha256
            dist/vk-gitlab.sha256
            dist/vk-runnerctl.sha256
            dist/build-info.txt
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
