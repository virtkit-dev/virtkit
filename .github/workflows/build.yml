name: Build

# Reusable workflow: build the binaries, optionally with the guest kernel.
# Called by ci.yml (on push/PR/dispatch) and release.yml (on a push to `release`).
#
# The kernel is built first, in the same job as the binaries: build.sh embeds
# dist/vmlinux into vk when it is present, so building both on one runner is what
# makes the released vk self-contained. A separate kernel job would leave build.sh
# with no vmlinux to embed.
#
# Inputs
#   artifact-prefix  — prefix for uploaded artifact names; callers set this to
#                      avoid collisions between CI and release runs on the same SHA.
#   build-kernel     — whether to build the guest kernel and embed it (default: false).
#   release-kernel   — embed the latest release's guest kernel instead, when kernel/ and
#                      build-kernel.sh are as that release built it; otherwise the kernel is
#                      built. Gives a vk that boots VMs without the kernel build's tens of
#                      minutes (default: false).
#   bootstrap-check  — after the Docker build, rebuild from scratch in a vk microVM with the
#                      vk just built and fail unless the binaries are byte-identical
#                      (build.sh --bootstrap-check). Needs build-kernel: the rebuild boots
#                      the kernel embedded in that vk. Roughly doubles the job, so release
#                      only (default: false).

on:
  workflow_call:
    inputs:
      artifact-prefix:
        type: string
        required: true
      build-kernel:
        type: boolean
        default: false
      release-kernel:
        type: boolean
        default: false
      bootstrap-check:
        type: boolean
        default: false
      retention-days:
        type: number
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The full history only when it decides whether the released kernel is still current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.release-kernel && !inputs.build-kernel && '0' || '1' }}

      # Build the kernel before the binaries so build.sh finds dist/vmlinux and
      # embeds it into vk. Skipped in ordinary CI — a full kernel build takes tens
      # of minutes and the kernel changes rarely.
      - name: Build guest kernel (vmlinux)
        if: inputs.build-kernel
        run: ./build-kernel.sh

      # The release's vmlinux, checked against its sidecar, is the one build-kernel.sh would
      # produce from the same kernel inputs: its manifest names the commit it was built at.
      # Inputs changed since then mean a kernel no release has, so it is built.
      - name: Fetch the released guest kernel (vmlinux)
        if: inputs.release-kernel && !inputs.build-kernel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download --pattern vmlinux --pattern vmlinux.sha256 \
            --pattern kernel-build-info.txt --dir dist
          ( cd dist && sha256sum -c vmlinux.sha256 )
          commit=$(awk '$1 == "git_commit:" { print $2 }' dist/kernel-build-info.txt)
          if git diff --quiet "$commit" HEAD -- kernel build-kernel.sh; then
            echo "embedding the guest kernel released at $commit"
          else
            echo "the kernel inputs changed since $commit; building the guest kernel"
            rm dist/vmlinux dist/vmlinux.sha256 dist/kernel-build-info.txt
            ./build-kernel.sh
          fi

      # Without either kernel step above there is no dist/vmlinux to embed, which build.sh
      # rejects unless the caller says it means it — so such a build passes --no-kernel.
      # These binaries are artifacts to grab from a commit, not releasable ones.
      # '' has to stay the last operand: it is falsy, so swapping the arms would make
      # `||` always fire and hand --no-kernel to the release build too.
      - name: Build binaries
        if: ${{ !inputs.bootstrap-check }}
        run: ./build.sh ${{ !(inputs.build-kernel || inputs.release-kernel) && '--no-kernel' || '' }}

      # The reproducibility attestation. build.sh --bootstrap-check does the Docker build,
      # then rebuilds a clean copy of the tree from scratch inside a vk microVM — booted by
      # the vk it just produced, on the kernel embedded in it — and fails unless both
      # backends yield byte-identical binaries. Only the runner's KVM stands between the
      # Docker build and that microVM, so the step below opens it to the runner user. No vk
      # install is needed — the check boots the freshly built dist/vk.
      - name: Enable KVM for the runner user
        if: inputs.bootstrap-check
        uses: ./.github/actions/enable-kvm

      - name: Build binaries and attest reproducibility (Docker == vk microVM)
        if: inputs.bootstrap-check
        run: ./build.sh --bootstrap-check

      - name: Upload binary artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-binaries-${{ github.sha }}
          path: |
            dist/vk
            dist/vk-agent
            dist/vk-registry
            dist/vk-hub
            dist/vk-runnerctl
            dist/vk.sha256
            dist/vk-agent.sha256
            dist/vk-registry.sha256
            dist/vk-hub.sha256
            dist/vk-runnerctl.sha256
            dist/build-info.txt
          retention-days: ${{ inputs.retention-days }}

      - name: Upload kernel artifact
        if: inputs.build-kernel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-kernel-${{ github.sha }}
          path: |
            dist/vmlinux
            dist/vmlinux.sha256
            dist/kernel-build-info.txt
          retention-days: ${{ inputs.retention-days }}
