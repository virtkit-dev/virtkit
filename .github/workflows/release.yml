name: Release

# Publish a GitHub release whenever a version tag (v*) is pushed.
#
# virtkit's artifacts are produced by the same reproducible scripts we use locally —
# build.sh (the static-musl binaries) and build-kernel.sh (the guest vmlinux). GitHub-hosted
# ubuntu runners ship Docker and KVM, so the workflow just runs those scripts and uploads
# everything they drop in dist/. The pinned toolchain lives in the image, not here, so the
# runner needs no Rust setup.
#
# build runs in parallel with quality (lint + test + audit); the kernel is built in
# the same job as the binaries so the published vk has it embedded, and the build runs as
# `build.sh --bootstrap-check`: the released bytes are attested by rebuilding them from
# scratch in a vk microVM and requiring an exact match. release publishes once both
# quality and build pass. Each binary ships with its own .sha256 sidecar
# (vk.sha256, vk-agent.sha256, vk-registry.sha256, vk-runnerctl.sha256,
# vmlinux.sha256) so users can verify just the file they downloaded without
# fetching a combined manifest.

on:
  push:
    tags:
      - 'v*'

# Default to read-only; the release job opts up to contents: write below.
permissions:
  contents: read

jobs:
  # Gate: run the same lint + test + audit checks as CI against the tagged commit. Runs in
  # parallel with build; the release job below waits on both.
  quality:
    uses: ./.github/workflows/quality.yml

  build:
    uses: ./.github/workflows/build.yml
    with:
      artifact-prefix: release
      build-kernel: true
      bootstrap-check: true
      retention-days: 1

  release:
    needs: [quality, build]
    runs-on: ubuntu-latest
    # gh release create needs write access to the repo's releases.
    permissions:
      contents: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-binaries-${{ github.sha }}
          path: dist

      - name: Download kernel artifact
        uses: actions/download-artifact@v7
        with:
          name: release-kernel-${{ github.sha }}
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            dist/vk \
            dist/vk.sha256 \
            dist/vk-agent \
            dist/vk-agent.sha256 \
            dist/vk-registry \
            dist/vk-registry.sha256 \
            dist/vk-runnerctl \
            dist/vk-runnerctl.sha256 \
            dist/vmlinux \
            dist/vmlinux.sha256 \
            dist/build-info.txt \
            dist/kernel-build-info.txt \
            --title "$tag" \
            --generate-notes
