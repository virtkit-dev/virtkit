# Active Directory lab: a corp.lab domain controller, a Linux job that creates the lab's users,
# two joined members and a Linux job that signs in to each machine over RDP, all on the run's
# LAN. Build the Windows images first (see lab.Dockerfile), then
#   vk run --compose lab-ad.compose.yaml
# A Windows service is up after provisioning. The accounts job waits for the DC's healthcheck
# (Active Directory answering), the members for the job to succeed; the run reports ready once
# both have joined.
# secrets/ holds committed example passwords: change them beyond a throwaway lab.
# join_password is vkjoin's, a Domain Admin.
secrets:
  join_password:
    file: ./secrets/join-password
  user_password:
    file: ./secrets/user-password

services:
  dc:
    image: ./dc-out
    secrets: [join_password]
    # Healthy once the DC locator finds it (DNS, an LDAP ping, Netlogon): a native tool, so a
    # check does not wait on PowerShell loading the AD module.
    healthcheck:
      test: ["CMD", "nltest", "/dsgetdc:corp.lab"]
      interval: 5s
      timeout: 30s
      retries: 60
    x-virtkit:
      mem: 3G
  # samba-tool, over LDAP to the DC, as the lab's admin account (accounts.sh).
  accounts:
    build:
      context: .
      dockerfile: accounts.Dockerfile
    depends_on:
      dc:
        condition: service_healthy
    environment: &lab
      LAB_DC: dc
      LAB_USERS: alice bob
    secrets: [join_password, user_password]
  member1:
    image: ./member-out
    depends_on:
      dc:
        condition: service_healthy
      accounts:
        condition: service_completed_successfully
    environment: *lab
    secrets: [join_password]
    x-virtkit:
      mem: 2G
  member2:
    image: ./member-out
    depends_on:
      dc:
        condition: service_healthy
      accounts:
        condition: service_completed_successfully
    environment: *lab
    secrets: [join_password]
    x-virtkit:
      mem: 2G
  # RDP sign-in to each machine as the lab's admin (rdp-check.sh).
  rdp-check:
    build:
      context: .
      dockerfile: rdp-check.Dockerfile
    depends_on: [member1, member2]
    environment:
      RDP_TARGETS: dc:CORP\vkjoin member1:CORP\vkjoin member2:CORP\vkjoin
    secrets: [join_password]
