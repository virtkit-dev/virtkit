# The simplest Windows use case: one Windows Server serving a page with IIS, and a Linux client
# on the same LAN that fetches it by the server's service name. Build the image first (see
# iis.Dockerfile), then
#   vk run --compose iis.compose.yaml
# The client waits for the server's healthcheck (IIS answering on port 80), prints the page,
# and ends.
services:
  web:
    image: ./iis-out
    healthcheck:
      test: ["CMD", "curl.exe", "-sf", "-o", "NUL", "http://localhost/"]
      interval: 5s
      timeout: 20s
      retries: 24
    x-virtkit:
      mem: 2G
  client:
    image: docker.io/library/alpine:3.20
    depends_on:
      web:
        condition: service_healthy
    command: ["sh", "-c", "wget -qO- http://web/ | grep 'Hello from IIS'"]
