[package]
name = "vk-hub"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# `vk-hub serve` enrolls `vk node`s, holds their sessions and keeps their inventory and
# heartbeats; `vk-hub local` serves this machine's VMs. Both use the same server stack as
# `vk-registry`: hyper over tokio, rustls on ring and a redb database.
[[bin]]
name = "vk-hub"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
bytes.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
# `process`: the `vk` commands local mode runs; `fs`: the release binaries streamed to nodes
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync", "process", "fs"] }
rustls.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
tokio-tungstenite.workspace = true
futures.workspace = true
redb.workspace = true
ring.workspace = true
sha2.workspace = true
# column widths in the CLI's tables
unicode-width.workspace = true
libc.workspace = true
# the admin socket's private bind
vk-fs = { path = "../vk-fs" }
vk-hub-proto = { path = "../vk-hub-proto" }
# the web UI's OIDC sign-in, shared with vk-registry
vk-oidc = { path = "../vk-oidc" }

[dev-dependencies]
vk-oidc = { path = "../vk-oidc", features = ["fake-idp"] }

[target.'cfg(target_env = "musl")'.dependencies]
jemallocator.workspace = true
