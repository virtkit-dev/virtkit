[package]
name = "vk-hub"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# The hub: `vk-hub serve` enrolls `vk node`s, holds their sessions, and keeps their inventory
# and heartbeats; `vk-hub local` serves a web UI for the VMs of the machine it runs on. Built
# like `vk-registry`'s server — hyper over tokio, rustls on ring, a redb database — so the two
# central daemons share their operational shape.
[[bin]]
name = "vk-hub"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
bytes.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
# `process`: the `vk` commands local mode runs; `fs`: release binaries streamed to the nodes
# downloading them
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync", "process", "fs"] }
rustls.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-tungstenite.workspace = true
futures.workspace = true
redb.workspace = true
ring.workspace = true
sha2.workspace = true
# column widths in the CLI's tables
unicode-width.workspace = true
libc.workspace = true
# the admin socket's private bind
vk-fs = { path = "../vk-fs" }
vk-fleet-proto = { path = "../vk-fleet-proto" }

[target.'cfg(target_env = "musl")'.dependencies]
jemallocator.workspace = true
